<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Viewer</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/bf012bcfa3.js"></script>
</head>
<body>
  
  <main>
    <div class="container">
      <div class="profile-card">
        <div class="profile-header">
          
          <div class="head">
            <div class="profile-name">
              <div class="profile-logo"></div>
              <h1>Alex Carter</h1>
            </div>
          
            <div class="settings"><i class="fa-solid fa-gear"></i></div>
          </div>
          
          <h3>Frontend Developer</h3>
        </div>
        
        <div class="activity">
          <div class="Projects charts">
            <h2>Projects</h2>
            <h3>12</h3>
          </div>
          <div class="Followers charts">
            <h2>Followers</h2>
            <h3>343</h3>
          </div>
          <div class="Following charts">
            <h2>Following</h2>
            <h3>102</h3>
          </div>
        </div>
        
        <div class="about">
          <h2>About</h2>
          <p>Building cool things with HTML and CSS</p>
        </div>
        
        <div class="buttons">
          <button>View Profile</button>
          <button>Message</button>
        </div>
      </div>
    </div>
  </main>
  
</body>
</html>
